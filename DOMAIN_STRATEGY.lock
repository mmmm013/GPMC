
DOMAIN STRATEGY RULE:

CORE PRINCIPLE:
- All domains are entry points into one unified GPMx system.
- Domains must not fragment data, logic, or inventory.
- Domains differ by audience and intent, not by backend system.

PRIMARY DOMAINS:
- sentimeants.com = THE LANDING. One front door to all three tiers
  (HUG, TUG, BUG). Plural because it is many things meant: the store.
- gputnammusic.com = PIX retail (downloadable songs and catalog).
- mmmm-songs.com = SUPE / licensing / professional access (moments, hooks, phrases, sections).

TIER PLATFORMS (one tier each, reached from the landing):
- 13hugz.com = HUG, the whole song section. $7.99.
- sentimeant.com = TUG, one line or phrase. $4.99. Singular because it is
  one line meant.
- i-meant.com = BUG and Story BUG, one word or sound. $1.99.

RETIRED:
- k-kut.com = the retired brand. Its ROOT PATH 308s to the landing.
  EVERY OTHER PATH STAYS LIVE AND MUST NOT BE REDIRECTED, because every
  Stripe payment link returns a paying buyer to
  https://k-kut.com/delivered?session_id={CHECKOUT_SESSION_ID}. A host-wide
  redirect strands a buyer who has already paid, on all three tiers at once.
  Retire the host only after every live payment link has been repointed.

AMENDED 2026-10-06, on GD's instruction: "amend the lock and redirect
k-kut.com to the landing", answering his own question "why not use
sentimeants.com as landing, and sentimeant.com for TUGs?"

  WHAT THIS REPLACED, and why it had to go: this file said
  "k-kut.com = HUG experience". That had been false in the code for some
  time -- SATELLITE_LAW in the k-kut repo has given HUG to 13hugz.com, TUG
  to sentimeant.com and BUG to i-meant.com, with no entry for k-kut.com at
  all. So the lock named a primary domain for a job another host was doing,
  while the front door sat on a brand GD dropped on 2026-10-02 ("K-KUT is
  dropped. The product IS the tier."). The lock and the code now agree.

  And sentimeants.com was a defensive typo-catcher that 308'd every path to
  the singular: a domain paid for annually that nobody could arrive at.

FUTURE DOMAINS:
- Must map to a clear user intent (e.g., gifting, discovery, pro search, artist brand).
- Must route into existing system flows (HUG, PIX, 4PE).
- Must not introduce duplicate systems or parallel databases.

AI / BOT PRINCIPLE:
- AI/BOTs assist discovery, packaging, routing, and delivery.
- AI/BOTs do not replace the original human vocal asset.
- All final audio remains real, verified, and source-controlled.

USER EXPERIENCE GOAL:
- “Listening heaven”: immediate emotional match, clarity, beauty, and ease.
- No internal jargon exposed (no mK, KPD, etc. in UI).
- Language must be simple: moments, hooks, phrases, sections.

CROSS-DOMAIN FLOW:
- HUG → (needs download) → gputnammusic.com
- HUG → (needs professional use) → mmmm-songs.com
- SUPE → (wants to send) → sentimeants.com
- any tier platform → (wants another tier) → sentimeants.com

CONTROL RULE:
- Any new domain must declare:
  1) user type
  2) intent
  3) entry action
  4) exit routing
- If unclear, do not launch domain.

DECLARED DOMAINS:

- songandchance.com = SONG & CHANCE, the artist brand. The duo: Gregory D
  Putnam writes the words, Michael Scherer takes the chances. GD named it
  himself on 2026-10-01 -- "Song & Chance?" -- because it rides "song and
  dance" and so needs no explaining, and because chance is the truer word for
  what a jazz player does. The changes are the chart; the chance is the
  playing.

  THE FOUR DECLARATIONS, approved by GD on 2026-10-01 and recorded here on
  2026-10-06 on his instruction ("declare songandchance.com"):

    1) USER TYPE     someone who heard the name -- a listener, a venue, a sync
                     supervisor, a player who wants in
    2) INTENT        artist brand. Find out who Song & Chance are, and hear them
    3) ENTRY ACTION  listen
    4) EXIT ROUTING  gputnammusic.com to buy the song (PIX retail)
                     sentimeants.com to send a piece of one

  The exit routing's second leg said k-kut.com until 2026-10-06. It is the
  landing now, because k-kut.com's root 308s there and the retired brand is
  not a destination to hand a visitor.

  It is an ENTRY POINT into the existing GPMx system, not a parallel one: no
  new database and no duplicate inventory, both of which this file forbids.
  The page is deliberately spare -- there is no catalogue under this name yet,
  and a page that pretends otherwise is worse than one that does not.

  *** IT IS POINTED AT THE WRONG PROJECT, AND DECLARING IT DOES NOT FIX THAT.
  The page is app/song-and-chance/page.tsx in THIS repo, which deploys as the
  gputnam-music-final-site project. The DOMAIN is attached to the k-kut
  project, which has no song-and-chance route at all -- so a visitor who types
  the name reaches the Element store and never sees the duo. Its declared
  ENTRY ACTION, "listen", cannot happen.

  The fix is one Vercel change and not a code change: move songandchance.com
  (and www) off the k-kut project and onto gputnam-music-final-site. Building
  a second Song & Chance page inside k-kut would satisfy the routing and
  violate the rule above it -- duplicate systems are forbidden -- so it is not
  the answer. Until the domain is moved, this declaration describes an
  intention and not a working entry point, and this paragraph stays here.

